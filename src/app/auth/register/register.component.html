

<div class="glass-container">
  <div class="glass-card">
    
    <h2>REGISTRO</h2>
    <p class="subtitle">Crea tu cuenta en el Asistente Universitario</p>

    <!-- Formulario reactivo -->
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      
      <!-- Campo Nombre Completo -->
      <div class="input-group">
        <input type="text" formControlName="nombreCompleto" placeholder="Nombre completo" required>
      </div>

      <!-- Campo Correo -->
      <div class="input-group">
        <input type="email" formControlName="correo" placeholder="Correo electrónico" required>
      </div>

      <!-- Campo Contraseña -->
      <div class="input-group">
        <input type="password" formControlName="password" placeholder="Contraseña" required>
      </div>

      <!-- Campo Confirmar Contraseña -->
      <div class="input-group">
        <input type="password" formControlName="confirmPassword" placeholder="Confirmar contraseña" required>
      </div>

      <!-- Botón Verde de Registro -->
      <button type="submit" class="btn-register">REGISTRARSE</button>
    </form>

    <!-- Enlace para ir al Login -->
    <div class="login-redirect">
      <p>¿Ya tienes acceso? <a routerLink="/auth/login">Inicia sesión</a></p>
    </div>

  </div>
</div>
